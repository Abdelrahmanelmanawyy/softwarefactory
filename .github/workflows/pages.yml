# Mirror of the site on GitHub Pages (github.io is reachable on Turkish ISPs
# that block *.workers.dev). Cloudflare keeps deploying from its own build.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - name: Root redirect to Turkish + disable Jekyll
        run: |
          touch out/.nojekyll
          cat > out/index.html <<'EOF'
          <!doctype html><html lang="tr"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./tr">
          <link rel="canonical" href="./tr"><title>Software Fabrika</title></head>
          <body><a href="./tr">Software Fabrika</a></body></html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
